<div class="container-fluid app-container p-0">
    @if (error) {
        <div class="container-xl py-4">
            <app-error [httpErrorResponse]="error"></app-error>
        </div>
    }

    @if (!error) {
        <header class="bg-white shadow-sm border-bottom">
            <div class="container-xl py-4">
                <h1 class="display-6 fw-bold mb-3">Map</h1>
                <p class="text-muted mb-1">Loads only data inside your current map viewport from the backend.</p>
                <p class="text-muted mb-0">Zoom to level {{ minShapeZoom }} for routes and {{ minStopZoom }} for stops.</p>
                <div class="d-flex align-items-center gap-3 mt-2 flex-wrap">
                    @if (lastUpdated) {
                        <div class="small text-muted">Last refresh: <strong>{{ lastUpdated | date: 'HH:mm:ss' }}</strong></div>
                    }
                </div>
            </div>
        </header>

        <div class="map-container">
            @if (loading) {
                <div class="map-loading-indicator">
                    <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                    Loading&hellip;
                </div>
            }

            <div
                id="map"
                class="map"
                leaflet
                [leafletOptions]="options"
                [leafletLayers]="layers"
                [leafletLayersControl]="layersControl"
                (leafletMapReady)="onMapReady($event)"
            ></div>
        </div>
    }
</div>
